<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Redaktion &ndash; MyRegioCar</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Kurzer Hinweis, solange der Editor noch laedt */
      #laedt {
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #6b7887;
        padding: 3rem 1.5rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <p id="laedt">Redaktionsbereich wird geladen &hellip;</p>

    <!--
      Der Editor selbst wird von unpkg geladen.
      Das ist die einzige Stelle im gesamten Projekt, die etwas von einem
      fremden Server holt - und sie betrifft ausschliesslich diese
      Redaktionsseite, nie die oeffentliche Website. Besucher der Website
      laden weiterhin nichts von Dritten.
    -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      window.addEventListener('load', function () {
        var hinweis = document.getElementById('laedt');
        if (hinweis) hinweis.remove();
      });
    </script>
  </body>
</html>
