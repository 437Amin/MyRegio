# =============================================================================
#  Auftragsvermittlung MyRegioCar
# =============================================================================
#  Einrichten:
#    1. npx wrangler login
#    2. npx wrangler d1 create vermittlung   -> die ausgegebene ID unten eintragen
#    3. npm run db:anlegen
#    4. Geheimnisse setzen (siehe unten)
#    5. npm run deploy
# =============================================================================

name = "myregiocar-vermittlung"
main = "src/index.ts"
compatibility_date = "2025-07-18"

# Eigene Adresse fuer den Fahrerbereich. Cloudflare legt den DNS-Eintrag beim
# Veroeffentlichen selbst an.
routes = [
  { pattern = "vermittlung.myregiocar.com", custom_domain = true }
]

# BLEIBT VORERST AN. Sonst schaltet Cloudflare die workers.dev-Adresse in
# dem Moment ab, in dem die eigene Domain dazukommt - und der bei Telegram
# hinterlegte Webhook zeigt noch dorthin. Die Fahrer koennten dann keine
# Auftraege mehr annehmen.
#
# Reihenfolge: 1. veroeffentlichen  2. Webhook bei Telegram auf die neue
# Adresse umstellen  3. hier auf false setzen und erneut veroeffentlichen.
workers_dev = true

# Diese Werte sind nicht geheim und duerfen im Repository stehen.
[vars]
# Woher Anfragen an /api/... kommen duerfen. Mehrere mit Komma trennen.
#
# Seit dem Livegang am 20.09.2026 steht hier nur noch die echte Adresse. Die
# frueheren Eintraege sind weg: Die workers.dev-Adresse der Website schaltet
# Cloudflare ab, sobald ein Worker eine eigene Domain hat, und der lokale
# Entwicklungsserver wird nur voruebergehend gebraucht.
#
# Zum Entwickeln wieder ergaenzen: ",http://localhost:4321"
ERLAUBTE_HERKUNFT = "https://www.myregiocar.com"
TELEGRAM_BOT_NAME = "MyRegioBot"

[[d1_databases]]
binding = "DB"
database_name = "vermittlung"
database_id = "5bac0f39-52ba-473c-9ea4-35d2b3701263"

[[durable_objects.bindings]]
name = "VERMITTLUNG"
class_name = "Vermittlung"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Vermittlung"]

[observability]
enabled = true

# =============================================================================
#  Geheimnisse - NICHT hier eintragen, sondern einzeln setzen mit:
#
#    npx wrangler secret put TELEGRAM_TOKEN
#    npx wrangler secret put TELEGRAM_WEBHOOK_GEHEIMNIS
#    npx wrangler secret put CHEF_CHAT_ID
#    npx wrangler secret put ADMIN_PASSWORT
#
#  Sie liegen dann verschluesselt bei Cloudflare und tauchen nirgends im
#  Repository auf.
# =============================================================================
